[workspace]
authors = ["Robert Cocker <rcocker87@gmail.com>"]
channels = ["conda-forge"]
name = "homepage"
platforms = ["linux-64"]
version = "0.1.3"

[tasks]
dev = "pnpm vite"
build = "pnpm vite build && cp CNAME dist/ && cp dist/index.html dist/404.html"
deploy = "pnpm gh-pages -d dist"

[dependencies]
python = ">=3.14.10,<3.15"
nodejs = ">=26.12.1,<26.13"
vim = ">=9.2.1054,<10"
tldr = ">=3.4.4,<4"
qtsass = ">=0.4.0,<0.5"
nano = ">=9.3,<10"
emacs = ">=31.1,<32"
pnpm = ">=12.4.1,<13"
angular-cli = ">=22.2.4,<23"
tree = ">=2.3.2,<3"
eslint = ">=10.13.0,<11"
prettier = ">=3.9.10,<4"
yamllint = ">=1.38.0,<2"
markdownlint-cli = ">=0.49.1,<0.50"

[pypi-dependencies]
npm = ">=0.1.1, <0.2"
clamd = ">=1.0.2, <2"
