[workspace]
authors = ["Robert Cocker <rcocker87@gmail.com>"]
channels = ["conda-forge"]
name = "homepage"
platforms = ["linux-64"]
version = "0.1.3"

[tasks]
dev = "pnpm vite"
build = "pnpm vite build && cp CNAME dist/ && cp dist/index.html dist/404.html"
deploy = "pnpm gh-pages -d dist"

[dependencies]
python = ">=3.14.10,<3.15"
nodejs = ">=26.13.1,<26.14"
vim = ">=9.2.1252,<10"
tldr = ">=3.4.4,<4"
qtsass = ">=0.4.0,<0.5"
nano = ">=9.3,<10"
emacs = ">=31.1,<32"
pnpm = ">=12.20.0,<13"
tree = ">=2.3.2,<3"
eslint = ">=10.14.0,<11"
prettier = ">=3.10.1,<4"
yamllint = ">=1.38.0,<2"
markdownlint-cli = ">=0.49.1,<0.50"
rust = ">=1.100.0,<1.101"
trunk = ">=0.22.1,<0.23"
wasm-bindgen-cli = ">=0.2.130,<0.3"

[pypi-dependencies]
npm = ">=0.1.1, <0.2"
clamd = ">=1.0.2, <2"
